[project]
name = "any2md-converter"
version = "0.1.0"
description = "Local JSONL worker for Any2MD Desktop"
requires-python = ">=3.12,<3.13"
dependencies = [
    "markitdown[docx,pdf,pptx,xlsx]==0.1.5",
    "openpyxl==3.1.5",
    "pandas==3.0.5",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.0,<7",
    "pytest>=9.0,<10",
    "python-docx>=1.2,<2",
    "reportlab>=4,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
