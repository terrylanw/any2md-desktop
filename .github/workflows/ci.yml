name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Flutter dependencies
        run: flutter pub get
      - name: Flutter analysis
        run: flutter analyze
      - name: Flutter tests
        run: flutter test
      - name: Converter dependencies
        working-directory: converter
        run: uv sync --dev
      - name: Converter tests
        working-directory: converter
        run: uv run pytest -q
